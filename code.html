<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos Aleatorios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2a3c7f, #4a5fcc);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .code-display {
            font-size: 3rem;
            margin: 30px 0;
            padding: 25px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            letter-spacing: 5px;
            font-weight: bold;
            color: #feb47b;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }
        
        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #copyBtn {
            background: linear-gradient(to right, #2193b0, #6dd5ed);
        }
        
        #copyBtn.copied {
            background: linear-gradient(to right, #28a745, #20c997);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }
        
        .success {
            background-color: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }
        
        .error {
            background-color: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        
        .codes-list {
            margin-top: 30px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
        }
        
        .codes-list h3 {
            margin-bottom: 10px;
            color: #feb47b;
        }
        
        .codes-list ul {
            list-style-type: none;
            padding-left: 0;
        }
        
        .codes-list li {
            padding: 8px 12px;
            margin-bottom: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .codes-list li .word {
            opacity: 0.7;
            font-style: italic;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #feb47b;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .code-display {
                font-size: 2.2rem;
                padding: 20px;
            }
            
            button {
                min-width: 100%;
            }
            
            .buttons-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generador de Códigos Aleatorios</h1>
        <p>Obtén un código aleatorio del archivo codes.txt para usarlo en el juego</p>
        
        <div class="code-display" id="codeDisplay">
            Presiona "Generar Código"
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cargando códigos...</p>
        </div>
        
        <div class="buttons-container">
            <button id="generateBtn" onclick="generateRandomCode()">🎲 Generar Código Aleatorio</button>
            <button id="copyBtn" onclick="copyToClipboard()">📋 Copiar Código</button>
        </div>
        
        <div class="message success" id="successMessage">
            ✅ Código copiado al portapapeles
        </div>
        
        <div class="message error" id="errorMessage">
            ❌ Error al cargar los códigos
        </div>
        
       
    </div>

    <script>
        // Variables globales
        let codes = [];
        let currentCode = "";
        
        // Cargar códigos desde el archivo TXT
        async function loadCodes() {
            const loadingElement = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const codesList = document.getElementById('codesList');
            
            loadingElement.style.display = 'block';
            errorMessage.style.display = 'none';
            
            try {
                // Intentar cargar desde diferentes ubicaciones
                let response;
                const possiblePaths = [
                    'codes.txt',
                    './codes.txt',
                    '/codes.txt',
                    'https://raw.githubusercontent.com/jalvarengavelasquez-dot/impostor/main/codes.txt'
                ];
                
                for (const path of possiblePaths) {
                    try {
                        response = await fetch(path);
                        if (response.ok) break;
                    } catch (e) {
                        console.log(`No se pudo cargar desde: ${path}`);
                    }
                }
                
                if (!response || !response.ok) {
                    throw new Error('No se pudo cargar el archivo codes.txt');
                }
                
                const data = await response.text();
                
                // Procesar los códigos
                codes = [];
                const lines = data.split('\n');
                
                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (trimmedLine) {
                        const [code, word] = trimmedLine.split(',');
                        if (code && word) {
                            codes.push({
                                code: code.trim().toUpperCase(),
                                word: word.trim()
                            });
                        }
                    }
                });
                
                if (codes.length === 0) {
                    throw new Error('No se encontraron códigos en el archivo');
                }
                
                // Actualizar la lista de códigos disponibles
                updateCodesList();
                
                // Generar un código aleatorio inicial
                generateRandomCode();
                
                console.log(`Códigos cargados: ${codes.length}`);
                
            } catch (error) {
                console.error('Error:', error);
                showError('No se pudo cargar el archivo codes.txt. Asegúrate de que existe en el mismo directorio.');
            } finally {
                loadingElement.style.display = 'none';
            }
        }
        
        // Actualizar la lista de códigos disponibles
        function updateCodesList() {
            const codesList = document.getElementById('codesList');
            codesList.innerHTML = '';
            
            codes.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="code">${item.code}</span>
                    <span class="word">${item.word}</span>
                `;
                codesList.appendChild(li);
            });
        }
        
        // Generar un código aleatorio
        function generateRandomCode() {
            if (codes.length === 0) {
                showError('No hay códigos disponibles. Carga los códigos primero.');
                return;
            }
            
            // Seleccionar un código aleatorio
            const randomIndex = Math.floor(Math.random() * codes.length);
            const selected = codes[randomIndex];
            currentCode = selected.code;
            
            // Mostrar el código
            const codeDisplay = document.getElementById('codeDisplay');
            codeDisplay.textContent = currentCode;
            
            // Resetear el botón de copiar
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = '📋 Copiar Código';
            copyBtn.classList.remove('copied');
            
            // Ocultar mensajes previos
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            console.log(`Código generado: ${currentCode} (${selected.word})`);
        }
        
        // Copiar al portapapeles
        function copyToClipboard() {
            if (!currentCode) {
                showError('No hay código para copiar. Genera uno primero.');
                return;
            }
            
            // Usar la API del portapapeles
            navigator.clipboard.writeText(currentCode)
                .then(() => {
                    // Mostrar mensaje de éxito
                    const successMessage = document.getElementById('successMessage');
                    successMessage.style.display = 'block';
                    
                    // Actualizar el botón de copiar
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.textContent = '✅ ¡Copiado!';
                    copyBtn.classList.add('copied');
                    
                    // Ocultar el mensaje después de 3 segundos
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 3000);
                    
                    console.log(`Código copiado: ${currentCode}`);
                })
                .catch(err => {
                    // Fallback para navegadores antiguos
                    fallbackCopyToClipboard(currentCode);
                });
        }
        
        // Fallback para navegadores que no soportan la API del portapapeles
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                
                // Mostrar mensaje de éxito
                const successMessage = document.getElementById('successMessage');
                successMessage.style.display = 'block';
                
                // Actualizar el botón de copiar
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = '✅ ¡Copiado!';
                copyBtn.classList.add('copied');
                
                // Ocultar el mensaje después de 3 segundos
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
                
                console.log(`Código copiado (fallback): ${text}`);
            } catch (err) {
                showError('No se pudo copiar el código. Intenta manualmente.');
            }
            
            document.body.removeChild(textArea);
        }
        
        // Mostrar mensaje de error
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = `❌ ${message}`;
            errorMessage.style.display = 'block';
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Generador de códigos iniciado');
            loadCodes();
            
            // Permitir copiar con Ctrl+C cuando el código está mostrado
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'c' && currentCode) {
                    e.preventDefault();
                    copyToClipboard();
                }
            });
        });
        
        // Auto-generar un nuevo código cada 30 segundos (opcional)
        // setInterval(generateRandomCode, 30000);
    </script>
</body>
</html>
